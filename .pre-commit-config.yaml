repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: pytest-check
        name: pytest-check
        entry: pytest tests/
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
